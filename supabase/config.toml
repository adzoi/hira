# Edge Function gateway: requireJWT blocks anon-only requests (apikey only).
# cv-get serves public slug/user_id reads using service role inside the handler — JWT is enforced there where needed.
# get-homepage-vip is a public homepage feed.
# get-home-feed / get-listings-page / get-jobs-page are public catalog reads (rate-limited, Redis-cached).

[functions.cv-get]
verify_jwt = false

[functions.get-homepage-vip]
verify_jwt = false

[functions.get-home-feed]
verify_jwt = false

[functions.get-listings-page]
verify_jwt = false

[functions.get-jobs-page]
verify_jwt = false

[functions.sitemap]
verify_jwt = false

# Link-preview images; proxied by server.mjs at /og/<kind>/<id>.png.
[functions.og-image]
verify_jwt = false

# Called by pg_cron (trigger_weekly_digest); authenticated by X-Gigori-Webhook-Secret inside the function.
[functions.send-weekly-digest]
verify_jwt = false

# Authorized by the HMAC token in the email link.
[functions.digest-unsubscribe]
verify_jwt = false

[functions.auth-login]
verify_jwt = false

[functions.auth-rate-limit]
verify_jwt = false

[functions.content-rate-limit]
verify_jwt = false

# Called by the notify_via_email trigger; authenticated by X-Gigori-Webhook-Secret inside the function.
[functions.send-notification-email]
verify_jwt = false

[db]
major_version = 15

[db.migrations]
enabled = true

[db.seed]
enabled = false
