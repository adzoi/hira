<!doctype html>
<html lang="ka">
  <body style="margin:0;padding:0;background:#F8F9FC;font-family:Arial,Helvetica,sans-serif;color:#1B2B4B;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#F8F9FC;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;background:#ffffff;border:1px solid #E2E8F0;border-radius:16px;padding:32px;">
            <tr>
              <td>
                <p style="margin:0 0 24px;font-size:24px;font-weight:bold;color:#0088FF;">Hira</p>
                <h1 style="margin:0 0 12px;font-size:20px;">შესვლა ჰირაზე</h1>
                <p style="margin:0 0 24px;font-size:15px;line-height:1.6;">ანგარიშში შესასვლელად დააჭირე ღილაკს ან შეიყვანე ეს კოდი:</p>
                <p style="margin:0 0 24px;">
                  <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=magiclink" style="display:inline-block;background:#0088FF;color:#ffffff;text-decoration:none;font-weight:bold;font-size:15px;padding:12px 24px;border-radius:8px;">შესვლა</a>
                </p>
                <p style="margin:0 0 24px;font-size:28px;font-weight:bold;letter-spacing:6px;color:#1B2B4B;background:#F1F5F9;border-radius:8px;padding:12px 16px;text-align:center;">{{ .Token }}</p>
                <p style="margin:0 0 8px;font-size:13px;line-height:1.6;color:#64748B;">თუ შესვლა არ გიცდია, უგულებელყავი ეს წერილი.</p>
                <p style="margin:0;font-size:13px;line-height:1.6;color:#64748B;">Use the button or the code above to log in to Hira. If you did not try to log in, ignore this email.</p>
              </td>
            </tr>
          </table>
          <p style="margin:16px 0 0;font-size:12px;color:#94A3B8;">Hira · hira.ge</p>
        </td>
      </tr>
    </table>
  </body>
</html>
